[package]
name = "mkff-wgpu"
version = "0.1.0-dev"
edition = "2021"
license = "MIT"
description = "WGPU example: display MKFF software-decoded HEVC frames (NV12 CPU upload)"
publish = false

[[example]]
name = "view"
path = "examples/view.rs"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
mkff = { path = "../mkff", default-features = false, features = ["bundled", "hevc", "hevc-software-fallback"] }
pollster = "0.4"
wgpu = { version = "24", features = ["wgsl"] }
winit = "0.30"
