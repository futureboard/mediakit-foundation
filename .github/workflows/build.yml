name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build clang pkg-config libva-dev libdrm-dev

      - name: Configure
        run: cmake --preset linux-clang-debug
        # FetchContent needs network for pinned libhevc when not vendored.

      - name: Build
        run: cmake --build --preset linux-clang-debug

      - name: Test
        run: ctest --preset linux-clang-debug --output-on-failure

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo build (bundled native)
        run: cargo build -p mkff

      - name: Cargo test (bundled native)
        run: cargo test -p mkff

      - name: Cargo test mkff-vk
        run: cargo test -p mkff-vk

  macos:
    name: macOS (Clang / VideoToolbox)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Configure
        run: cmake --preset macos-clang-debug

      - name: Build
        run: cmake --build --preset macos-clang-debug

      - name: Test
        run: ctest --preset macos-clang-debug --output-on-failure

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo build (bundled native)
        run: cargo build -p mkff

      - name: Cargo test (bundled native)
        run: cargo test -p mkff

  windows:
    name: Windows (MSVC / D3D11 Video Decode)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Ninja + cl.exe rather than the Visual Studio generator: it
      # doesn't depend on guessing which VS version string a given
      # runner image ships (that broke once already), just on cl.exe
      # being on PATH, which this action sets up directly.
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: seanmiddleditch/gha-setup-ninja@master

      - name: Configure
        run: cmake --preset windows-msvc-debug

      - name: Build
        run: cmake --build --preset windows-msvc-debug

      - name: Test
        run: ctest --preset windows-msvc-debug --output-on-failure

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo build (bundled native)
        run: cargo build -p mkff

      - name: Cargo test (bundled native)
        run: cargo test -p mkff
