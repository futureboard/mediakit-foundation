[workspace]
resolver = "2"
members = [
    "bindings/rust/mkff-sys",
    "bindings/rust/mkff",
    "bindings/rust/mkff-vk",
    "bindings/rust/mkff-wgpu",
]
# mkff-vk is Linux/Vulkan-only; mkff-wgpu is a display example.
# Keep both out of the default set so `cargo test` stays portable.
default-members = [
    "bindings/rust/mkff-sys",
    "bindings/rust/mkff",
]
