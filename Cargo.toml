[workspace]
resolver = "2"
members = [
    "bindings/rust/mkff-sys",
    "bindings/rust/mkff",
    "bindings/rust/mkff-vk",
]
# mkff-vk is Linux/Vulkan-only; keep it out of the default set so
# `cargo test` on Windows/macOS builds the portable crates.
default-members = [
    "bindings/rust/mkff-sys",
    "bindings/rust/mkff",
]
